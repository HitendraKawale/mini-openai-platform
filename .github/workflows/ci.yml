name: mini-openai-platform-ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  python-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python files
        run: |
          python -m compileall services tests

      - name: Run unit tests
        run: |
          pytest tests -q

  docker-builds:
    runs-on: ubuntu-latest
    needs: python-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: |
          docker compose -f infrastructure/compose/docker-compose.yml config

      - name: Build api-gateway image
        run: |
          docker build -t mini-openai-api-gateway-ci ./services/api-gateway

      - name: Build llm-service image
        run: |
          docker build -t mini-openai-llm-service-ci ./services/llm-service

      - name: Build embedding-service image
        run: |
          docker build -t mini-openai-embedding-service-ci ./services/embedding-service

      - name: Build rag-service image
        run: |
          docker build -t mini-openai-rag-service-ci ./services/rag-service

  rag-quality-gate:
    runs-on: ubuntu-latest
    needs: python-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The retrieval eval needs qdrant, embedding-service and rag-service,
      # but not the LLM: rag-service is started with --no-deps so the
      # Ollama-backed llm-service is not required in CI.
      - name: Start retrieval stack
        run: |
          docker compose -f infrastructure/compose/docker-compose.yml up -d --build qdrant embedding-service
          docker compose -f infrastructure/compose/docker-compose.yml up -d --build --no-deps rag-service

      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8002/health >/dev/null \
               && curl -sf http://localhost:8003/health >/dev/null; then
              echo "services ready"
              exit 0
            fi
            sleep 5
          done
          echo "services did not become ready"
          docker compose -f infrastructure/compose/docker-compose.yml logs embedding-service rag-service
          exit 1

      - name: Run retrieval quality gate
        run: |
          python evals/run_eval.py --retrieval-only --min-hit-rate 0.8 --min-mrr 0.5

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report
          path: evals/report.json
          if-no-files-found: ignore
